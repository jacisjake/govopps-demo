# Machine-readable acceptance-criteria registry (issue #2).
# Schema: {id, phase, text, falsified_when, test, mutant, workstream, status, jev}
# status: ready   -> test + mutant ship now; all three arms gate `jev_ci run`.
#         example -> deliberately weak AC-1.2 placeholder, shipped to prove the
#                    coverage arm flags it; reported but never gates the exit code.
#         pending -> test/mutant belong to a future workstream; skipped gracefully.
# The 18 rows AC-1.1..AC-4.2 are seeded verbatim from
# docs/digital-twin-implementation-plan.md §"Falsifiable acceptance";
# AC-11.1..AC-11.4 come from issue #2. The registry, not the code, is the contract.

- id: AC-1.1
  phase: 1
  text: "Only legal claim state transitions occur (no silent verified->attested, no auto-cleared contradicted)"
  falsified_when: "any path writes an illegal state transition (e.g. verified->attested silently, contradicted auto-cleared)"
  test: "code.tests.test_twin::TestStateTransitions"
  mutant: "code/tests/mutants/AC-1.1.patch"
  workstream: "#3"
  status: pending
  jev: true

- id: AC-1.2
  phase: 1
  text: "Silence is never denial: an unanswered question leaves a claim missing, never not_held"
  falsified_when: "twin contains a credential `not_held` after an unanswered turn"
  test: "code.tests.test_jev_ci::TestAC12WeakExample"
  mutant: "code/tests/mutants/AC-1.2.patch"
  workstream: "#2 (example; #3 replaces with the real intake-eval replay)"
  status: example
  jev: true

